name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        shell: bash
        # On failure, surface npm's last output lines as annotations (visible without log access).
        run: |
          npm ci --loglevel=warn > npm-ci.log 2>&1 || {
            grep -v '^\s*$' npm-ci.log | tail -10 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: node dist/cli.js doctor
