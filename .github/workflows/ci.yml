name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        shell: bash
        # On failure, surface npm's error lines as annotations (visible without log access).
        run: |
          npm ci || {
            for f in "$(npm config get cache)"/_logs/*.log; do
              grep -E "verbose stack|error" "$f" | tail -8 | while IFS= read -r l; do echo "::error::${l}"; done
            done
            exit 1
          }
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: node dist/cli.js doctor
